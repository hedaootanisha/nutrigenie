<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NutriGenie</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Background Circles -->

    <div class="floating-circle one"></div>
    <div class="floating-circle two"></div>
    <div class="floating-circle three"></div>

    <!-- Main Container -->

    <div class="container py-5">

        <!-- Heading -->

        <h1 class="text-center page-title mb-3">

            🍱 NutriGenie

        </h1>

        <p class="text-center subtitle mb-5">

            Smart AI Meal Planner For Healthy Living

        </p>

        <!-- Form Card -->

        <div class="form-container">

            <div class="emoji-header">

                🥗 🍔 🍎 🍕 🍌

            </div>

            <form id="mealForm">

                <!-- Diet -->

                <div class="mb-4">

                    <label>Diet Preference</label>

                    <select class="custom-input"
                            id="diet">

                        <option value="Veg">

                            Veg

                        </option>

                        <option value="Non-Veg">

                            Non-Veg

                        </option>

                        <option value="Both">

                            Both

                        </option>

                    </select>

                </div>

                <!-- Goal -->

                <div class="mb-4">

                    <label>Fitness Goal</label>

                    <select class="custom-input"
                            id="goal">

                        <option value="Weight Loss">

                            Weight Loss

                        </option>

                        <option value="Weight Gain">

                            Weight Gain

                        </option>

                        <option value="Maintenance">

                            Maintenance

                        </option>

                    </select>

                </div>

                <!-- Budget -->

                <div class="mb-4">

                    <label>Daily Budget (₹)</label>

                    <input
                        type="number"
                        class="custom-input"
                        id="budget"
                        placeholder="Example: 300"
                    >

                </div>

                <!-- Calories -->

                <div class="mb-4">

                    <label>Calories Needed</label>

                    <input
                        type="number"
                        class="custom-input"
                        id="calories"
                        placeholder="Example: 1800"
                    >

                </div>

                <!-- Button -->

                <button class="custom-btn w-100">

                    ✨ Generate Smart Meal Plan

                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
